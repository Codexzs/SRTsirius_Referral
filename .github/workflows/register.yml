name: Register Accounts

on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 12 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium & UIAutomator2
        run: |
          npm install -g appium --no-audit --no-fund
          appium driver install uiautomator2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: pip install Appium-Python-Client selenium

      - name: Ensure identities.txt exists
        run: |
          if [ ! -f identities.txt ]; then
            touch identities.txt
            echo "Created empty identities.txt"
          else
            echo "identities.txt exists with $(wc -l < identities.txt) entries"
          fi

      - name: Run Emulator & Create Account
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          heap-size: 512M
          emulator-options: >
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none -no-snapshot
          script: |
            echo "=== Installing APK ==="
            adb install -r app.apk
            
            if ! adb shell pm list packages | grep -q "com.siriusnetwork.app"; then
              echo "❌ APK installation failed"
              exit 1
            fi
            echo "✅ APK installed successfully"
            
            echo "=== Starting Appium ==="
            appium --log-level info &
            
            TIMEOUT=60
            while ! nc -z localhost 4723; do
              sleep 1
              TIMEOUT=$((TIMEOUT-1))
              if [ $TIMEOUT -le 0 ]; then
                echo "❌ Appium failed to start in 60s"
                exit 1
              fi
            done
            echo "✅ Appium is up on port 4723"
            
            echo "=== Running register.py ==="
            python register.py
            
            # Hard-kill the emulator to prevent the runner's teardown from hanging
            pkill -9 -f qemu-system 2>/dev/null || true

      - name: Commit New Identity to GitHub
        run: |
          git config --global user.name "Farming Bot"
          git config --global user.email "bot@example.com"
          git add identities.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Backup new identity [skip ci]" && git push)
        continue-on-error: true
