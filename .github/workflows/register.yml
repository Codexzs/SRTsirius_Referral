name: Register Accounts

on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 12 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium & UIAutomator2
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: pip install Appium-Python-Client selenium

      - name: Ensure identities.txt exists
        run: touch identities.txt

      # ⬇️ NO APK DOWNLOAD NEEDED! The APK is in the repo and checked out automatically.

      - name: Run Emulator & Create Account
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: >
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none
          script: |
            adb install -r app.apk
            appium &
            while ! nc -z localhost 4723; do sleep 1; done
            python register.py

      - name: Commit New Identity to GitHub
        run: |
          git config --global user.name "Farming Bot"
          git config --global user.email "bot@example.com"
          git add identities.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Backup new identity [skip ci]" && git push)
        continue-on-error: true
