name: Register Accounts

on:
  schedule:
    # Runs 5 times a day — each run gets a fresh GitHub Actions IP
    - cron: '0 5 * * *'
    - cron: '0 9 * * *'
    - cron: '0 13 * * *'
    - cron: '0 17 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium & UIAutomator2 Driver
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: pip install Appium-Python-Client selenium

      - name: Ensure identities.txt exists
        run: touch identities.txt

      - name: Download APK
        run: curl -L -o app.apk "https://your-staging-server.com/app-latest.apk"

      - name: Run Emulator & Create 1 Account
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: >
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none
          script: |
            adb install -r ./app.apk
            appium &
            while ! nc -z localhost 4723; do sleep 1; done
            python register.py

      - name: Commit Identity Key to GitHub
        run: |
          git config --global user.name "Farming Bot"
          git config --global user.email "bot@example.com"
          git add identities.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Backup new identity [skip ci]" && git push)
        continue-on-error: true
