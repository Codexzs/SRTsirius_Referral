name: Daily Farming

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  farm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium & UIAutomator2
        run: |
          npm install -g appium --no-audit --no-fund
          appium driver install uiautomator2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: pip install Appium-Python-Client selenium

      - name: Run Emulator & Farm All Accounts
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          heap-size: 512M
          emulator-options: >
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none -no-snapshot
          script: |
            echo "=== Installing APK ==="
            adb install -r app.apk
            
            if ! adb shell pm list packages | grep -q "com.siriusnetwork.app"; then
              echo "❌ APK installation failed"
              exit 1
            fi
            echo "✅ APK installed successfully"
            
            echo "=== Starting Appium ==="
            appium --log-level info &
            APPIUM_PID=$!
            
            TIMEOUT=60
            while ! nc -z localhost 4723; do
              sleep 1
              TIMEOUT=$((TIMEOUT-1))
              if [ $TIMEOUT -le 0 ]; then
                echo "❌ Appium failed to start in 60s"
                exit 1
              fi
            done
            echo "✅ Appium is up on port 4723"
            
            echo "=== Running daily_login.py ==="
            python daily_login.py
